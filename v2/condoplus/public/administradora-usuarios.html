<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Condo+ — Usuários</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<script src="assets/common.js"></script>
<script src="assets/componentes.js"></script>
<script src="assets/BasePage.js"></script>
<script>
// Gabriel — CRUD de usuários do sistema (tabela usuarios)
// é só config pra CrudPage do Marcel
const PERFIS = [['morador', 'Morador'], ['sindico', 'Síndico'], ['administradora', 'Administradora'],
                ['porteiro', 'Porteiro'], ['prestador', 'Prestador de serviço'], ['suporte', 'Suporte']];
const nomePerfil = v => (PERFIS.find(p => p[0] === v) || [v, v])[1];

new CrudPage({
  tela: 'a_usuarios',
  titulo: 'Usuários do sistema',
  nomeSingular: 'usuário',
  recurso: '/usuarios',
  antesDeCarregar: async p => { p.condominios = await api.get('/condominios'); },
  ajuda: 'Contas de acesso ao Condo+. Morador precisa de unidade; morador, síndico e porteiro precisam de um condomínio. Na edição, deixe a senha em branco para manter a atual.',
  colunas: p => [  // o que aparece na tabela
    { rotulo: 'Nome', html: u => `${esc(u.nome)}<div class="meta">${esc(u.email)}</div>` },
    { rotulo: 'Perfil', html: u => esc(nomePerfil(u.perfil)) },
    { rotulo: 'Condomínio', html: u => esc((p.condominios.find(c => c.id === u.condominio_id) || {}).nome || '—') },
    { rotulo: 'Unidade', html: u => esc(u.unidade || '—') },
    { rotulo: 'Status', html: u => tag('ativo', u.status) },
  ],
  campos: [  // campos do form (meu CampoFactory monta)
    { nome: 'nome', rotulo: 'Nome completo', obrigatorio: true },
    { nome: 'email', rotulo: 'E-mail (login)', tipo: 'email', obrigatorio: true },
    { nome: 'senha', rotulo: 'Senha', tipo: 'senha', obrigatorioNaCriacao: true, placeholder: 'mínimo 4 caracteres' },
    { nome: 'perfil', rotulo: 'Perfil', tipo: 'selecao', opcoes: PERFIS },
    { nome: 'condominio_id', rotulo: 'Condomínio', tipo: 'selecao',
      opcoes: p => [['', '— nenhum —'], ...p.condominios.map(c => [c.id, c.nome])] },
    { nome: 'unidade', rotulo: 'Unidade (só para morador)' },
    { nome: 'status', rotulo: 'Status', tipo: 'selecao', opcoes: [['ativo', 'Ativo'], ['inativo', 'Inativo']] },
  ],
  podeExcluir: (u, p) => u.id !== p.usuario.id, // não deixa excluir a própria conta
  descricao: u => u.email,
}).iniciar();
</script>
</body>
</html>
