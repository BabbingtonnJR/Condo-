<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Condo+ — Comunicados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<script src="assets/common.js"></script>
<script src="assets/componentes.js"></script>
<script src="assets/BasePage.js"></script>
<script>
// Babbingtonn — CRUD de comunicados (tabela comunicados)
// é só config pra CrudPage do Marcel
new CrudPage({
  tela: 's_comunicados',
  titulo: 'Comunicados',
  nomeSingular: 'comunicado',
  rotuloNovo: 'Publicar comunicado',
  recurso: '/comunicados',
  filtros: p => ({ condominio_id: p.usuario.condominio_id }),  // só pega o que é do meu condomínio
  fixos:   p => ({ condominio_id: p.usuario.condominio_id }),
  colunas: [  // o que aparece na tabela
    { rotulo: 'Comunicado', html: c => `<div style="font-weight:500;">${esc(c.titulo)}</div><div class="meta">${esc(c.corpo)}</div>` },
    { rotulo: 'Publicado em', html: c => fmt.data(c.publicado_em) },
  ],
  campos: [  // campos do form (o CampoFactory do Gabriel monta)
    { nome: 'titulo', rotulo: 'Título', obrigatorio: true },
    { nome: 'corpo', rotulo: 'Mensagem', tipo: 'areatexto' },
  ],
  vazio: 'Nenhum comunicado publicado.',
}).iniciar();
</script>
</body>
</html>
