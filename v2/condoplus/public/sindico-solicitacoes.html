<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Condo+ — Solicitações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<script src="assets/common.js"></script>
<script src="assets/componentes.js"></script>
<script src="assets/BasePage.js"></script>
<script>
// Babbingtonn — síndico muda status e escolhe o prestador das solicitações
// é só config pra CrudPage do Marcel
new CrudPage({
  tela: 's_solicitacoes',
  titulo: 'Solicitações do condomínio',
  nomeSingular: 'solicitação',
  recurso: '/solicitacoes',
  permitirCriar: false, // quem abre é o morador
  filtros: p => ({ condominio_id: p.usuario.condominio_id }),  // só pega o que é do meu condomínio
  antesDeCarregar: async p => {
    p.prestadores = await api.get('/usuarios?perfil=prestador&status=ativo');
  },
  colunas: p => [  // o que aparece na tabela
    { rotulo: labelUnidade(p.usuario), campo: 'unidade' },
    { rotulo: 'Solicitação', html: s => `${esc(s.titulo)}<div class="meta">${esc(s.categoria)} · ${fmt.data(s.criado_em)}</div>` },
    { rotulo: 'Prestador', html: s => esc(s.prestador_nome || '—') },
    { rotulo: 'Status', html: s => tag('solicitacao', s.status) },
  ],
  campos: [  // campos do form (o CampoFactory do Gabriel monta)
    { nome: 'status', rotulo: 'Status', tipo: 'selecao',
      opcoes: [['aberto', 'Aberto'], ['progresso', 'Em andamento'], ['concluido', 'Concluído']] },
    { nome: 'prestador_nome', rotulo: 'Prestador responsável', tipo: 'selecao',
      opcoes: p => [['', '— nenhum —'], ...p.prestadores.map(x => [x.nome, x.nome])] },
    { nome: 'categoria', rotulo: 'Categoria', tipo: 'selecao', opcoes: ['Manutenção', 'Ocorrência', 'Outro'] },
  ],
  vazio: 'Nenhuma solicitação registrada.',
}).iniciar();
</script>
</body>
</html>
