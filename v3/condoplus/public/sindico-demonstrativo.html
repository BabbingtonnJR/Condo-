<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Condo+ — Demonstrativo mensal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<script src="assets/common.js"></script>
<script src="assets/componentes.js"></script>
<script src="assets/BasePage.js"></script>
<script src="assets/RelatorioPage.js"></script>
<script>
// André — SE02: demonstrativo financeiro do mês (emitido x arrecadado)
// FTR: Lançamento Financeiro, Condomínio, Unidade
class TelaDemonstrativo extends RelatorioPage {
  titulo(){ return 'Demonstrativo financeiro mensal'; }
  renderizarConteudo(d){
    const m = d.mes;
    if(!m) return '<div class="empty">Ainda não tem lançamento nesse condomínio.</div>';
    const opcoes = d.competencias.map(c => `<option ${c === m.competencia ? 'selected' : ''}>${esc(c)}</option>`).join('');
    return `<div class="filtros"><div class="field"><label for="f-comp">Competência</label>
        <select id="f-comp" onchange="pagina.filtrar('competencia', this.value)">${opcoes}</select></div>
        <div class="meta" style="font-size:12.5px;color:var(--ink-soft);padding-bottom:10px;">vencimento ${fmt.data(m.vencimento)}</div></div>`
      + this.kpis([
        [fmt.moeda(m.totalEmitido), 'Total emitido'],
        [fmt.moeda(m.totalArrecadado), 'Total arrecadado'],
        [fmt.moeda(m.totalPendente), 'Pendente'],
        [fmt.pct(m.taxaArrecadacao), 'Taxa de arrecadação'],
      ])
      + this.kpis([
        [m.unidadesAdimplentes, labelUnidade(this.usuario) + 's adimplentes'],
        [m.unidadesInadimplentes, labelUnidade(this.usuario) + 's com pendência'],
        [fmt.moeda(m.valorMedioPorUnidade), 'Valor médio por ' + labelUnidade(this.usuario).toLowerCase()],
      ])
      + this.tabela('Histórico das últimas competências', [
        { rotulo: 'Competência', html: h => esc(h.competencia) },
        { rotulo: 'Vencimento', html: h => fmt.data(h.vencimento) },
        { rotulo: 'Emitido', num: true, derivado: true, html: h => fmt.moeda(h.totalEmitido) },
        { rotulo: 'Arrecadado', num: true, derivado: true, html: h => fmt.moeda(h.totalArrecadado) },
        { rotulo: 'Pendente', num: true, derivado: true, html: h => fmt.moeda(h.totalPendente) },
        { rotulo: 'Arrecadação', derivado: true, html: h => `<div style="display:flex;gap:8px;align-items:center;">${this.barra(h.taxaArrecadacao)}<span>${fmt.pct(h.taxaArrecadacao)}</span></div>` },
      ], d.historico)
      + this.rodape('Taxa de arrecadação = arrecadado ÷ emitido.');
  }
}
new TelaDemonstrativo('s_demonstrativo', 'demonstrativo').iniciar();
</script>
</body>
</html>
