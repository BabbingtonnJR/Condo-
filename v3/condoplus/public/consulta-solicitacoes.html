<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Condo+ — Consultar solicitações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<script src="assets/common.js"></script>
<script src="assets/componentes.js"></script>
<script src="assets/BasePage.js"></script>
<script src="assets/ConsultaPage.js"></script>
<script>
// Babbingtonn — CE02: consultar solicitações por categoria e status
// entrada: categoria, status, unidade | saída: título, unidade, categoria, status, prestador, aberta em
// ALI: Solicitação, Unidade, Usuário (prestador)
new ConsultaPage({
  tela: 'c_solicitacoes', consulta: 'solicitacoes', codigo: 'CE02',
  titulo: 'Consultar solicitações',
  fixos: pg => ({ condominio_id: pg.usuario.condominio_id }),
  entradas: pg => [
    { nome: 'categoria', rotulo: 'Categoria', tipo: 'selecao', obrigatorio: true, opcoes: [['', 'Escolha…'], 'Manutenção', 'Ocorrência', 'Outro'] },
    { nome: 'status', rotulo: 'Status', tipo: 'selecao', opcoes: [['', 'Todos'], ['aberto', 'Aberto'], ['progresso', 'Em andamento'], ['concluido', 'Concluído']] },
    { nome: 'unidade', rotulo: labelUnidade(pg.usuario) + ' (opcional)' },
  ],
  colunas: pg => [
    { rotulo: 'Título', html: s => esc(s.titulo) },
    { rotulo: labelUnidade(pg.usuario), html: s => esc(s.unidade) },
    { rotulo: 'Categoria', html: s => esc(s.categoria) },
    { rotulo: 'Status', html: s => tag('solicitacao', s.status) },
    { rotulo: 'Prestador', html: s => esc(s.prestador_nome || '—') },
    { rotulo: 'Aberta em', html: s => fmt.dataHora(s.criado_em) },
  ],
}).iniciar();
</script>
</body>
</html>
