<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Condo+ — Visitantes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<script src="assets/common.js"></script>
<script src="assets/componentes.js"></script>
<script src="assets/BasePage.js"></script>
<script>
// Marcel — CRUD de visitantes (tabela visitantes)
// é só config pra minha CrudPage
new CrudPage({
  tela: 'p_visitantes',
  titulo: 'Visitantes',
  nomeSingular: 'visitante',
  rotuloNovo: 'Registrar entrada',
  recurso: '/visitantes',
  filtros: p => ({ condominio_id: p.usuario.condominio_id }),  // só pega o que é do meu condomínio
  fixos:   p => ({ condominio_id: p.usuario.condominio_id }),
  colunas: p => [  // o que aparece na tabela
    { rotulo: 'Visitante', campo: 'nome' },
    { rotulo: 'Documento', html: v => esc(v.documento || '—') },
    { rotulo: `${labelUnidade(p.usuario)} visitada`, campo: 'unidade' },
    { rotulo: 'Entrada', html: v => fmt.dataHora(v.horario) },
  ],
  campos: p => [  // campos do form (o CampoFactory do Gabriel monta)
    { nome: 'nome', rotulo: 'Nome do visitante', obrigatorio: true },
    { nome: 'documento', rotulo: 'Documento', placeholder: 'Ex: RG 12.345.678-9' },
    { nome: 'unidade', rotulo: `${labelUnidade(p.usuario)} visitada`, obrigatorio: true },
  ],
  vazio: 'Nenhum visitante registrado.',
}).iniciar();
</script>
</body>
</html>
