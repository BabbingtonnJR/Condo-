<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Condo+ — Comunicados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<script src="assets/common.js"></script>
<script src="assets/componentes.js"></script>
<script src="assets/BasePage.js"></script>
<script>
// Babbingtonn — morador lê os comunicados do condomínio dele
// filha da BasePage do Marcel, só fiz o carregarDados e o renderizarConteudo
class ComunicadosMorador extends BasePage {
  titulo(){ return 'Comunicados'; }
  carregarDados(){ return api.get('/comunicados?condominio_id=' + this.usuario.condominio_id); }  // pega os dados na API
  renderizarConteudo(comunicados){  // monta o HTML da tela
    return `<div class="panel">
      ${comunicados.map(c => `
        <div class="list-item">
          <div><div style="font-weight:500;">${esc(c.titulo)}</div><div class="meta">${esc(c.corpo)}</div></div>
          <div class="meta" style="white-space:nowrap;">${fmt.data(c.publicado_em)}</div>
        </div>`).join('') || '<div class="empty">Nenhum comunicado publicado ainda.</div>'}
    </div>`;
  }
}
new ComunicadosMorador('m_comunicados').iniciar();
</script>
</body>
</html>
