<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Condo+ — Condomínios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main-content"><div class="loading">Carregando…</div></main>
</div>
<div class="modal-backdrop" id="modal-backdrop"><div class="modal" id="modal-body"></div></div>
<div class="toast" id="toast"></div>
<script src="assets/common.js"></script>
<script>
const PAGE_SCREEN = 'a_condominios';

async function renderMain(){
  const condominios = await api.get('/condominios');
  document.getElementById('main-content').innerHTML = `
    <div class="topbar"><h2>Condomínios</h2><div class="actions"><button class="btn btn-primary" onclick="modalCondominio()">+ Cadastrar condomínio</button></div></div>
    <div class="panel">
      ${condominios.map(c => {
        const modulos = typeof c.modulos === 'string' ? JSON.parse(c.modulos) : c.modulos;
        const ativos = Object.keys(modulos).filter(k => modulos[k]);
        return `
        <div class="list-item">
          <div>
            <div style="font-weight:500;">${c.nome} <span class="tag tag-progress">${c.tipo}</span></div>
            <div class="meta">${c.endereco || ''} · ${c.unidades} unidades · síndico: ${c.sindico_nome || '—'}</div>
            <div class="meta">Módulos ativos: ${ativos.length ? ativos.join(', ') : 'nenhum'}</div>
          </div>
          <a class="btn btn-ghost btn-sm" href="administradora-modulos.html">Configurar módulos</a>
        </div>`;
      }).join('') || '<div class="empty">Nenhum condomínio cadastrado.</div>'}
    </div>`;
}

function modalCondominio(){
  openModal(`
    <h3>Cadastrar condomínio</h3>
    <div class="field"><label>Nome do condomínio</label><input id="cd-nome"></div>
    <div class="field"><label>Endereço</label><input id="cd-endereco"></div>
    <div class="field"><label>Tipo de cliente</label>
      <select id="cd-tipo">
        <option value="residencial">Residencial</option>
        <option value="comercial">Comercial (escritórios)</option>
        <option value="clube">Clube / coworking</option>
      </select>
    </div>
    <div class="grid-2">
      <div class="field"><label>Nº de unidades</label><input id="cd-unidades" type="number"></div>
      <div class="field"><label>Síndico responsável</label><input id="cd-sindico"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarCondominio()">Cadastrar</button>
    </div>
  `);
}
async function salvarCondominio(){
  const nome = document.getElementById('cd-nome').value.trim();
  const endereco = document.getElementById('cd-endereco').value.trim();
  const unidades = parseInt(document.getElementById('cd-unidades').value) || 0;
  const sindico_nome = document.getElementById('cd-sindico').value.trim();
  const tipo = document.getElementById('cd-tipo').value;
  if(!nome){ toast('Informe o nome do condomínio.'); return; }
  try {
    await api.post('/condominios', { nome, endereco, unidades, sindico_nome, tipo });
    closeModal();
    toast('Condomínio cadastrado com os módulos padrão do tipo escolhido.');
    await renderMain();
  } catch(e){ toast(e.message); }
}

document.addEventListener('DOMContentLoaded', async () => {
  if(!requireLogin()) return;
  renderSidebar();
  try { await renderMain(); }
  catch(e){ document.getElementById('main-content').innerHTML = `<div class="error-box">${e.message}</div>`; }
});
</script>
</body>
</html>
