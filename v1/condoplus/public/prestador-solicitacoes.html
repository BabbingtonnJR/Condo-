<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Condo+ — Minhas solicitações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main-content"><div class="loading">Carregando…</div></main>
</div>
<div class="modal-backdrop" id="modal-backdrop"><div class="modal" id="modal-body"></div></div>
<div class="toast" id="toast"></div>
<script src="assets/common.js"></script>
<script>
const PAGE_SCREEN = 'pr_solicitacoes';

function tagStatus(s){
  const map = {aberto:['tag-open','Aberto'], progresso:['tag-progress','Em andamento'], concluido:['tag-done','Concluído']};
  const [cls,label] = map[s] || ['tag-open', s];
  return `<span class="tag ${cls}">${label}</span>`;
}

async function renderMain(){
  const u = getUser();
  const solicitacoes = await api.get('/solicitacoes?prestador=' + encodeURIComponent(u.nome));
  document.getElementById('main-content').innerHTML = `
    <div class="topbar"><h2>Solicitações atribuídas a você</h2></div>
    <div class="panel">
      ${solicitacoes.map(s => `
        <div class="list-item">
          <div><div style="font-weight:500;">${s.titulo}</div><div class="meta">Unidade ${s.unidade}</div></div>
          <div class="row-actions">
            ${tagStatus(s.status)}
            ${s.status!=='concluido' ? `<button class="btn btn-ghost btn-sm" onclick="concluirServico(${s.id})">Marcar como resolvido</button>` : ''}
          </div>
        </div>`).join('') || '<div class="empty">Nenhuma solicitação atribuída a você no momento.</div>'}
    </div>`;
}

async function concluirServico(id){
  try {
    await api.put('/solicitacoes/' + id, { status: 'concluido' });
    toast('Serviço marcado como resolvido.');
    await renderMain();
  } catch(e){ toast(e.message); }
}

document.addEventListener('DOMContentLoaded', async () => {
  if(!requireLogin()) return;
  renderSidebar();
  try { await renderMain(); }
  catch(e){ document.getElementById('main-content').innerHTML = `<div class="error-box">${e.message}</div>`; }
});
</script>
</body>
</html>
