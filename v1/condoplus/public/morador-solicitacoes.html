<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Condo+ — Solicitações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main-content"><div class="loading">Carregando…</div></main>
</div>
<div class="modal-backdrop" id="modal-backdrop"><div class="modal" id="modal-body"></div></div>
<div class="toast" id="toast"></div>
<script src="assets/common.js"></script>
<script>
const PAGE_SCREEN = 'm_solicitacoes';

function tagStatus(s){
  const map = {aberto:['tag-open','Aberto'], progresso:['tag-progress','Em andamento'], concluido:['tag-done','Concluído']};
  const [cls,label] = map[s] || ['tag-open', s];
  return `<span class="tag ${cls}">${label}</span>`;
}

async function renderMain(){
  const u = getUser();
  const solicitacoes = await api.get('/solicitacoes?unidade=' + encodeURIComponent(u.unidade));
  document.getElementById('main-content').innerHTML = `
    <div class="topbar"><h2>Solicitações</h2><div class="actions"><button class="btn btn-primary" onclick="modalNovaSolicitacao()">+ Nova solicitação</button></div></div>
    <div class="panel">
      ${solicitacoes.map(s => `
        <div class="list-item">
          <div><div style="font-weight:500;">${s.titulo}</div><div class="meta">${s.categoria} · aberta em ${new Date(s.criado_em).toLocaleDateString('pt-BR')}</div></div>
          <div>${tagStatus(s.status)}</div>
        </div>`).join('') || '<div class="empty"><span class="big">📋</span>Nenhuma solicitação aberta.</div>'}
    </div>`;
}

function modalNovaSolicitacao(){
  openModal(`
    <h3>Nova solicitação</h3>
    <p class="sub">Descreva o que precisa de atenção na sua unidade.</p>
    <div class="field"><label>Categoria</label>
      <select id="ns-cat"><option>Manutenção</option><option>Ocorrência</option><option>Outro</option></select>
    </div>
    <div class="field"><label>Título</label><input id="ns-titulo" placeholder="Ex: Torneira vazando"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarSolicitacao()">Enviar</button>
    </div>
  `);
}
async function salvarSolicitacao(){
  const u = getUser();
  const titulo = document.getElementById('ns-titulo').value.trim();
  const categoria = document.getElementById('ns-cat').value;
  if(!titulo){ toast('Descreva a solicitação.'); return; }
  try {
    await api.post('/solicitacoes', { unidade: u.unidade, titulo, categoria });
    closeModal();
    toast('Solicitação enviada ao síndico.');
    await renderMain();
  } catch(e){ toast(e.message); }
}

document.addEventListener('DOMContentLoaded', async () => {
  if(!requireLogin()) return;
  renderSidebar();
  try { await renderMain(); }
  catch(e){ document.getElementById('main-content').innerHTML = `<div class="error-box">${e.message}</div>`; }
});
</script>
</body>
</html>
