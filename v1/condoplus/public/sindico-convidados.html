<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Condo+ — Convidados de evento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<script src="assets/common.js"></script>
<script src="assets/componentes.js"></script>
<script src="assets/BasePage.js"></script>
<script>
new CrudPage({
  tela: 's_convidados',
  titulo: 'Convidados de evento',
  nomeSingular: 'convidado',
  rotuloNovo: 'Adicionar convidado',
  recurso: '/convidados',
  filtros: p => ({ condominio_id: p.usuario.condominio_id }),
  fixos:   p => ({ condominio_id: p.usuario.condominio_id }),
  ajuda: 'Módulo <strong>exclusivo de clubes</strong>: controla quem entra nos eventos do clube, algo que não existe em condomínios residenciais ou comerciais.',
  colunas: [
    { rotulo: 'Evento', campo: 'evento' },
    { rotulo: 'Convidado', campo: 'convidado' },
    { rotulo: 'Responsável', campo: 'responsavel' },
    { rotulo: 'Status', html: c => tag('convidado', c.status) },
  ],
  campos: p => [
    { nome: 'evento', rotulo: 'Evento', obrigatorio: true, placeholder: 'Ex: Festa junina do clube' },
    { nome: 'convidado', rotulo: 'Nome do convidado', obrigatorio: true },
    { nome: 'responsavel', rotulo: `Responsável (${rotulos(p.usuario).pessoa})` },
  ],
  acoes: [
    { rotulo: 'Confirmar', mostrar: c => c.status === 'convidado',
      executar: async c => { await api.patch(`/convidados/${c.id}/status`, { status: 'confirmado' }); return 'Presença confirmada.'; } },
    { rotulo: 'Registrar entrada', mostrar: c => c.status === 'confirmado',
      executar: async c => { await api.patch(`/convidados/${c.id}/status`, { status: 'presente' }); return 'Entrada registrada.'; } },
  ],
  vazio: 'Nenhum convidado cadastrado.',
}).iniciar();
</script>
</body>
</html>
