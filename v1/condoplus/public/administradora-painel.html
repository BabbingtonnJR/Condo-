<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Condo+ — Painel administrativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main-content"><div class="loading">Carregando…</div></main>
</div>
<div class="modal-backdrop" id="modal-backdrop"><div class="modal" id="modal-body"></div></div>
<div class="toast" id="toast"></div>
<script src="assets/common.js"></script>
<script>
const PAGE_SCREEN = 'a_painel';

async function renderMain(){
  const [condominios, solicitacoes] = await Promise.all([api.get('/condominios'), api.get('/solicitacoes')]);
  document.getElementById('main-content').innerHTML = `
    <div class="topbar"><h2>Painel administrativo</h2></div>
    <div class="grid-3">
      <div class="panel stat"><div class="num">${condominios.length}</div><div class="lbl">Condomínios administrados</div></div>
      <div class="panel stat"><div class="num">${condominios.reduce((a,c)=>a+c.unidades,0)}</div><div class="lbl">Unidades sob gestão</div></div>
      <div class="panel stat"><div class="num">${solicitacoes.filter(s=>s.status!=='concluido').length}</div><div class="lbl">Solicitações abertas (geral)</div></div>
    </div>
    <div class="panel">
      <h3>Visão geral por condomínio</h3>
      <table>
        <thead><tr><th>Condomínio</th><th>Síndico</th><th>Unidades</th></tr></thead>
        <tbody>${condominios.map(c => `<tr><td>${c.nome}</td><td>${c.sindico_nome || '—'}</td><td>${c.unidades}</td></tr>`).join('')}</tbody>
      </table>
    </div>`;
}

document.addEventListener('DOMContentLoaded', async () => {
  if(!requireLogin()) return;
  renderSidebar();
  try { await renderMain(); }
  catch(e){ document.getElementById('main-content').innerHTML = `<div class="error-box">${e.message}</div>`; }
});
</script>
</body>
</html>
