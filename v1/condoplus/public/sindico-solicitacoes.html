<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Condo+ — Solicitações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main-content"><div class="loading">Carregando…</div></main>
</div>
<div class="modal-backdrop" id="modal-backdrop"><div class="modal" id="modal-body"></div></div>
<div class="toast" id="toast"></div>
<script src="assets/common.js"></script>
<script>
const PAGE_SCREEN = 's_solicitacoes';

async function renderMain(){
  const solicitacoes = await api.get('/solicitacoes');
  document.getElementById('main-content').innerHTML = `
    <div class="topbar"><h2>Solicitações do condomínio</h2></div>
    <div class="panel">
      <table>
        <thead><tr><th>Unidade</th><th>Solicitação</th><th>Categoria</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${solicitacoes.map(s => `
            <tr>
              <td>${s.unidade}</td><td>${s.titulo}</td><td>${s.categoria}</td>
              <td id="tag-${s.id}">${s.status}</td>
              <td>
                <select onchange="mudarStatus(${s.id}, this.value)">
                  <option ${s.status==='aberto'?'selected':''} value="aberto">Aberto</option>
                  <option ${s.status==='progresso'?'selected':''} value="progresso">Em andamento</option>
                  <option ${s.status==='concluido'?'selected':''} value="concluido">Concluído</option>
                </select>
              </td>
            </tr>`).join('') || '<tr><td colspan="5"><div class="empty">Nenhuma solicitação registrada.</div></td></tr>'}
        </tbody>
      </table>
    </div>`;
}

async function mudarStatus(id, status){
  try {
    await api.put('/solicitacoes/' + id, { status });
    toast('Status da solicitação atualizado.');
    await renderMain();
  } catch(e){ toast(e.message); }
}

document.addEventListener('DOMContentLoaded', async () => {
  if(!requireLogin()) return;
  renderSidebar();
  try { await renderMain(); }
  catch(e){ document.getElementById('main-content').innerHTML = `<div class="error-box">${e.message}</div>`; }
});
</script>
</body>
</html>
