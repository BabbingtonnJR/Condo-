<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Condo+ — Encomendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main-content"><div class="loading">Carregando…</div></main>
</div>
<div class="modal-backdrop" id="modal-backdrop"><div class="modal" id="modal-body"></div></div>
<div class="toast" id="toast"></div>
<script src="assets/common.js"></script>
<script>
const PAGE_SCREEN = 'm_encomendas';

async function renderMain(){
  const u = getUser();
  const encomendas = await api.get('/encomendas?unidade=' + encodeURIComponent(u.unidade));
  document.getElementById('main-content').innerHTML = `
    <div class="topbar"><h2>Minhas encomendas</h2></div>
    <div class="panel">
      ${encomendas.map(e => `
        <div class="list-item">
          <div><div style="font-weight:500;">Encomenda recebida na portaria</div><div class="meta">Registrada ${new Date(e.recebido_em).toLocaleString('pt-BR')}</div></div>
          <div>${e.retirado ? '<span class="tag tag-done">Retirada</span>' : '<span class="tag tag-open">Aguardando retirada</span>'}</div>
        </div>`).join('') || '<div class="empty"><span class="big">📦</span>Nenhuma encomenda registrada.</div>'}
    </div>`;
}

document.addEventListener('DOMContentLoaded', async () => {
  if(!requireLogin()) return;
  renderSidebar();
  try { await renderMain(); }
  catch(e){ document.getElementById('main-content').innerHTML = `<div class="error-box">${e.message}</div>`; }
});
</script>
</body>
</html>
