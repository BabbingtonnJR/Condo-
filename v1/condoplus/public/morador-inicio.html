<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Condo+ — Início</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main-content"><div class="loading">Carregando…</div></main>
</div>
<div class="modal-backdrop" id="modal-backdrop"><div class="modal" id="modal-body"></div></div>
<div class="toast" id="toast"></div>
<script src="assets/common.js"></script>
<script>
const PAGE_SCREEN = 'm_home';

async function renderMain(){
  const u = getUser();
  const [solicitacoes, comunicados, encomendas] = await Promise.all([
    api.get('/solicitacoes?unidade=' + encodeURIComponent(u.unidade)),
    api.get('/comunicados'),
    api.get('/encomendas?unidade=' + encodeURIComponent(u.unidade)),
  ]);
  const pendentes = encomendas.filter(e => !e.retirado);

  document.getElementById('main-content').innerHTML = `
    <div class="topbar"><div><h2>Olá, ${u.nome.split(' ')[0]}</h2><div class="crumb">Residencial Jardim das Acácias · Unidade ${u.unidade}</div></div></div>
    <div class="grid-3">
      <div class="panel stat"><div class="num">${solicitacoes.length}</div><div class="lbl">Suas solicitações</div></div>
      <div class="panel stat"><div class="num">${comunicados.length}</div><div class="lbl">Comunicados recentes</div></div>
      <div class="panel stat"><div class="num">${pendentes.length}</div><div class="lbl">Encomendas aguardando retirada</div></div>
    </div>
    <div class="panel">
      <h3>Últimos comunicados</h3>
      ${comunicados.slice(0,2).map(c => `
        <div class="list-item"><div><div>${c.titulo}</div><div class="meta">${new Date(c.publicado_em).toLocaleDateString('pt-BR')}</div></div></div>
      `).join('') || '<div class="empty">Nenhum comunicado ainda.</div>'}
      <div style="margin-top:10px;"><a class="btn btn-ghost btn-sm" href="morador-comunicados.html">Ver todos</a></div>
    </div>`;
}

document.addEventListener('DOMContentLoaded', async () => {
  if(!requireLogin()) return;
  renderSidebar();
  try { await renderMain(); }
  catch(e){ document.getElementById('main-content').innerHTML = `<div class="error-box">${e.message}</div>`; }
});
</script>
</body>
</html>
