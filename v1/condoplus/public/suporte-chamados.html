<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Condo+ — Chamados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main-content"><div class="loading">Carregando…</div></main>
</div>
<div class="modal-backdrop" id="modal-backdrop"><div class="modal" id="modal-body"></div></div>
<div class="toast" id="toast"></div>
<script src="assets/common.js"></script>
<script>
const PAGE_SCREEN = 'su_chamados';

function tagStatus(s){
  const map = {aberto:['tag-open','Aberto'], progresso:['tag-progress','Em andamento'], concluido:['tag-done','Concluído']};
  const [cls,label] = map[s] || ['tag-open', s];
  return `<span class="tag ${cls}">${label}</span>`;
}

async function renderMain(){
  const chamados = await api.get('/chamados');
  document.getElementById('main-content').innerHTML = `
    <div class="topbar"><h2>Fila de chamados técnicos</h2></div>
    <div class="panel">
      <table>
        <thead><tr><th>Usuário</th><th>Assunto</th><th>Escalado</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${chamados.map(c => `
            <tr>
              <td>${c.usuario}</td><td>${c.assunto}</td>
              <td>${c.escalado ? '<span class="tag tag-late">Escalado</span>' : '—'}</td>
              <td>${tagStatus(c.status)}</td>
              <td class="row-actions">
                ${c.status!=='concluido' ? `<button class="btn btn-ghost btn-sm" onclick="resolver(${c.id})">Resolver</button><button class="btn btn-ghost btn-sm" onclick="escalar(${c.id})">Escalar</button>` : ''}
              </td>
            </tr>`).join('') || '<tr><td colspan="5"><div class="empty">Nenhum chamado registrado.</div></td></tr>'}
        </tbody>
      </table>
    </div>`;
}

async function resolver(id){
  try { await api.patch('/chamados/' + id + '/resolver'); toast('Chamado resolvido.'); await renderMain(); }
  catch(e){ toast(e.message); }
}
async function escalar(id){
  try { await api.patch('/chamados/' + id + '/escalar'); toast('Chamado escalonado para o nível superior.'); await renderMain(); }
  catch(e){ toast(e.message); }
}

document.addEventListener('DOMContentLoaded', async () => {
  if(!requireLogin()) return;
  renderSidebar();
  try { await renderMain(); }
  catch(e){ document.getElementById('main-content').innerHTML = `<div class="error-box">${e.message}</div>`; }
});
</script>
</body>
</html>
