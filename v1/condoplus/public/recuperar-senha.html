<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Condo+ — Recuperar senha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="login-screen">
  <div class="login-card">
    <div class="login-brand"><span class="mark"></span><h1>Condo+</h1></div>
    <p class="login-sub">Vamos te ajudar a voltar a acessar sua conta.</p>
    <div class="field">
      <label>E-mail cadastrado</label>
      <input type="email" placeholder="voce@exemplo.com">
    </div>
    <button class="btn btn-primary btn-block" id="enviar-btn">Enviar link de recuperação</button>
    <div class="login-links"><a href="login.html">Voltar para o login</a></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2000);
  }
  document.getElementById('enviar-btn').addEventListener('click', () => {
    toast('Link de recuperação enviado.');
    setTimeout(()=> window.location.href = 'login.html', 900);
  });
</script>
</body>
</html>
