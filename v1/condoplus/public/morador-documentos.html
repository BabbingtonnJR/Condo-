<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Condo+ — Documentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main-content"><div class="loading">Carregando…</div></main>
</div>
<div class="modal-backdrop" id="modal-backdrop"><div class="modal" id="modal-body"></div></div>
<div class="toast" id="toast"></div>
<script src="assets/common.js"></script>
<script>
const PAGE_SCREEN = 'm_documentos';

async function renderMain(){
  const documentos = await api.get('/documentos');
  document.getElementById('main-content').innerHTML = `
    <div class="topbar"><h2>Documentos</h2></div>
    <div class="panel">
      <table>
        <thead><tr><th>Documento</th><th>Tipo</th><th>Publicado em</th><th></th></tr></thead>
        <tbody>
          ${documentos.map(d => `
            <tr>
              <td>${d.nome}</td><td>${d.tipo}</td><td>${new Date(d.publicado_em).toLocaleDateString('pt-BR')}</td>
              <td><button class="btn btn-ghost btn-sm" onclick="toast('Abrindo ${d.nome}…')">Abrir</button></td>
            </tr>`).join('') || '<tr><td colspan="4"><div class="empty">Nenhum documento publicado.</div></td></tr>'}
        </tbody>
      </table>
    </div>`;
}

document.addEventListener('DOMContentLoaded', async () => {
  if(!requireLogin()) return;
  renderSidebar();
  try { await renderMain(); }
  catch(e){ document.getElementById('main-content').innerHTML = `<div class="error-box">${e.message}</div>`; }
});
</script>
</body>
</html>
