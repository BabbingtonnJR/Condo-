<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Condo+ — Documentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<script src="assets/common.js"></script>
<script src="assets/componentes.js"></script>
<script src="assets/BasePage.js"></script>
<script>
class DocumentosMorador extends BasePage {
  titulo(){ return 'Documentos'; }
  carregarDados(){ return api.get('/documentos?condominio_id=' + this.usuario.condominio_id); }
  renderizarConteudo(documentos){
    return `<div class="panel"><div class="table-wrap"><table>
      <thead><tr><th>Documento</th><th>Tipo</th><th>Publicado em</th></tr></thead>
      <tbody>
        ${documentos.map(d => `<tr><td>${esc(d.nome)}</td><td>${esc(d.tipo)}</td><td>${fmt.data(d.publicado_em)}</td></tr>`).join('')
          || '<tr><td colspan="3"><div class="empty">Nenhum documento publicado.</div></td></tr>'}
      </tbody>
    </table></div></div>`;
  }
}
new DocumentosMorador('m_documentos').iniciar();
</script>
</body>
</html>
