<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Condo+ — Reservas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main-content"><div class="loading">Carregando…</div></main>
</div>
<div class="modal-backdrop" id="modal-backdrop"><div class="modal" id="modal-body"></div></div>
<div class="toast" id="toast"></div>
<script src="assets/common.js"></script>
<script>
const PAGE_SCREEN = 'm_reservas';

function tagReserva(s){
  const map = {pendente:['tag-open','Pendente'], confirmada:['tag-done','Confirmada'], cancelada:['tag-inactive','Cancelada']};
  const [cls,label] = map[s] || ['tag-open', s];
  return `<span class="tag ${cls}">${label}</span>`;
}

async function renderMain(){
  const reservas = await api.get('/reservas');
  document.getElementById('main-content').innerHTML = `
    <div class="topbar"><h2>Reservas de área comum</h2><div class="actions"><button class="btn btn-primary" onclick="modalNovaReserva()">+ Nova reserva</button></div></div>
    <div class="panel">
      ${reservas.map(r => `
        <div class="list-item">
          <div><div style="font-weight:500;">${r.area}</div><div class="meta">${new Date(r.data_reserva).toLocaleDateString('pt-BR')} · ${r.hora} · ${r.morador}</div></div>
          <div>${tagReserva(r.status)}</div>
        </div>`).join('') || '<div class="empty">Nenhuma reserva registrada.</div>'}
    </div>`;
}

function modalNovaReserva(){
  const u = getUser();
  openModal(`
    <h3>Nova reserva</h3>
    <p class="sub">Solicite o uso de uma área comum. O síndico confirma a reserva.</p>
    <div class="field"><label>Área</label>
      <select id="nr-area"><option>Salão de festas</option><option>Churrasqueira</option><option>Quadra poliesportiva</option></select>
    </div>
    <div class="grid-2">
      <div class="field"><label>Data</label><input id="nr-data" type="date"></div>
      <div class="field"><label>Horário</label><input id="nr-hora" placeholder="Ex: 19h–23h"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarReserva()">Solicitar</button>
    </div>
  `);
}
async function salvarReserva(){
  const u = getUser();
  const area = document.getElementById('nr-area').value;
  const data_reserva = document.getElementById('nr-data').value;
  const hora = document.getElementById('nr-hora').value.trim();
  if(!data_reserva){ toast('Escolha uma data.'); return; }
  try {
    await api.post('/reservas', { area, data_reserva, hora, morador: `${u.nome} (${u.unidade})` });
    closeModal();
    toast('Reserva solicitada.');
    await renderMain();
  } catch(e){ toast(e.message); }
}

document.addEventListener('DOMContentLoaded', async () => {
  if(!requireLogin()) return;
  renderSidebar();
  try { await renderMain(); }
  catch(e){ document.getElementById('main-content').innerHTML = `<div class="error-box">${e.message}</div>`; }
});
</script>
</body>
</html>
